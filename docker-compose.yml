name: laravel-mysql

services:
  # User is root by default
  db:
    image: dhi.io/mysql:${MYSQL_VERSION:-9}
    restart: always
    ports:
      - "${MYSQL_PORT:-8001}:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    command: mysqld
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8002}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
    networks:
      - backend

  cache:
    image: dhi.io/valkey:${VALKEY_VERSION:-9}
    restart: always
    ports:
      - "${VALKEY_PORT:-8003}:6380"
    volumes:
      - "./config/valkey/valkey.conf:/tmp/valkey.conf:ro"
      - "valkey-data:/data"
    command: valkey-server /tmp/valkey.conf
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 4

  valkey-admin:
    image: valkey/valkey-admin:1.1.1
    restart: always
    environment:
      DEPLOYMENT_MODE: "web"
      VALKEY_HOST: "cache"
      VALKEY_PORT: "6380"
      VALKEY_AUTH_TYPE: none
      VALKEY_TLS: false
    ports:
      - "${VALKEY_ADMIN_PORT:-8004}:8080"
    networks:
      - backend
    depends_on:
      cache:
        condition: service_healthy

volumes:
  mysql-data:
  valkey-data:

networks:
  backend:
    driver: bridge

secrets:
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
  valkey_password:
    environment: VALKEY_PASSWORD
